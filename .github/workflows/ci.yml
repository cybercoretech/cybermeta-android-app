name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Rust engine, unit tests, lint, debug APK
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Android NDK and cargo-ndk
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked

      - name: Rust bridge tests
        working-directory: rust
        run: cargo test

      - name: Unit tests (real engine via JNA), lint, debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: The APK must not ask for the network
        run: |
          perms=$("$ANDROID_SDK_ROOT"/build-tools/36.0.0/aapt2 dump permissions app/build/outputs/apk/debug/app-debug.apk)
          echo "$perms"
          if echo "$perms" | grep -q "android.permission.INTERNET"; then echo "INTERNET permission found"; exit 1; fi
